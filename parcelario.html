<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap');

  :root {
    --bg: #0d1117;
    --bg2: #161b22;
    --bg3: #21262d;
    --border: #30363d;
    --col-pago: #3fb950;
    --col-zute: #58a6ff;
    --col-beber: #e3b341;
    --col-active: #f78166;
    --text: #e6edf3;
    --text2: #8b949e;
    --text3: #6e7681;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Sora', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px;
    flex-shrink: 0;
    z-index: 1000;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }

  .app-title { font-size: 14px; font-weight: 700; }
  .app-title span { color: var(--col-active); }

  /* Layer toggle */
  .layer-toggle {
    display: flex;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    font-size: 11px;
    font-weight: 600;
  }
  .layer-btn {
    padding: 5px 10px;
    cursor: pointer;
    color: var(--text2);
    transition: all 0.15s;
    border: none;
    background: transparent;
    font-family: 'Sora', sans-serif;
    font-size: 11px;
    font-weight: 600;
  }
  .layer-btn.active { background: var(--border); color: var(--text); }
  .layer-btn:first-child { border-right: 1px solid var(--border); }

  /* Ramal tabs */
  .tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 8px;
  }
  .tab {
    flex: 1;
    padding: 6px 4px;
    border-radius: 8px;
    border: 1.5px solid var(--border);
    background: var(--bg3);
    color: var(--text2);
    font-family: 'Sora', sans-serif;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .tab.ap { border-color: var(--col-pago); background: rgba(63,185,80,0.12); color: var(--col-pago); }
  .tab.az { border-color: var(--col-zute); background: rgba(88,166,255,0.12); color: var(--col-zute); }
  .tab.ab { border-color: var(--col-beber); background: rgba(227,179,65,0.12); color: var(--col-beber); }
  .tab.at { border-color: var(--border); background: var(--bg3); color: var(--text); }

  /* Search */
  .search-wrapper { position: relative; }
  .search-input {
    width: 100%;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Sora', sans-serif;
    font-size: 14px;
    padding: 9px 12px;
    outline: none;
  }
  .search-input:focus { border-color: var(--col-zute); }
  .search-input::placeholder { color: var(--text3); }

  .search-dropdown {
    position: absolute;
    top: 100%;
    left: 0; right: 0;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 10px 10px;
    max-height: 260px;
    overflow-y: auto;
    z-index: 3000;
    display: none;
  }
  .search-dropdown.open { display: block; }

  .search-item {
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .search-item:last-child { border-bottom: none; }
  .search-item:active { background: var(--bg3); }
  .si-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .si-meta { font-size: 11px; color: var(--text2); display: flex; gap: 8px; align-items: center; }

  #map { flex: 1; z-index: 1; }

  /* Bottom info panel */
  .info-panel {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    padding: 14px 16px 28px;
    z-index: 2000;
    transform: translateY(100%);
    transition: transform 0.28s cubic-bezier(0.4,0,0.2,1);
    max-height: 55vh;
    overflow-y: auto;
  }
  .info-panel.open { transform: translateY(0); }

  .panel-handle {
    width: 36px; height: 4px;
    background: var(--border);
    border-radius: 4px;
    margin: 0 auto 12px;
  }

  .panel-name {
    font-size: 15px; font-weight: 700;
    color: var(--text);
    margin-bottom: 6px;
    padding-right: 36px;
    line-height: 1.3;
  }

  .panel-close {
    position: absolute; top: 14px; right: 14px;
    background: var(--bg3); border: 1px solid var(--border);
    color: var(--text2); border-radius: 6px;
    padding: 4px 10px; font-size: 12px;
    cursor: pointer; font-family: 'Sora', sans-serif;
  }

  .now-badge {
    display: inline-flex; align-items: center; gap: 5px;
    background: rgba(247,129,102,0.15);
    border: 1px solid var(--col-active);
    border-radius: 8px; padding: 3px 8px;
    font-size: 11px; font-weight: 600; color: var(--col-active);
    margin-bottom: 10px;
  }
  .now-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--col-active);
    animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.5;transform:scale(.8)} }

  .info-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 7px; margin: 10px 0 12px;
  }
  .info-field {
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px;
  }
  .info-label {
    font-size: 9px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--text3); margin-bottom: 2px;
  }
  .info-value { font-size: 12px; font-weight: 600; color: var(--text); font-family: 'JetBrains Mono', monospace; }

  .badge {
    display: inline-block; padding: 2px 7px;
    border-radius: 10px; font-size: 10px; font-weight: 600;
  }
  .bp { background: rgba(63,185,80,0.18); color: var(--col-pago); }
  .bz { background: rgba(88,166,255,0.18); color: var(--col-zute); }
  .bb { background: rgba(227,179,65,0.18); color: var(--col-beber); }

  .slots-title {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.07em; color: var(--text3); margin-bottom: 8px;
  }
  .slot-row {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 0; border-bottom: 1px solid var(--border);
    font-size: 12px;
  }
  .slot-row:last-child { border-bottom: none; }
  .slot-date { font-weight: 600; color: var(--text); min-width: 105px; }
  .slot-time { font-family: 'JetBrains Mono', monospace; color: var(--text2); font-size: 11px; flex:1; }
  .slot-now { background: rgba(247,129,102,0.2); color: var(--col-active); padding: 1px 7px; border-radius: 8px; font-size: 10px; font-weight: 700; }

  .no-schedule {
    font-size: 12px; color: var(--text3);
    background: var(--bg3); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px;
    font-style: italic;
  }

  /* LOCATION BUTTON */
  .locate-btn {
    position: absolute;
    bottom: 90px;
    left: 14px;
    z-index: 1500;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: var(--bg2);
    border: 1.5px solid var(--border);
    color: var(--text);
    font-size: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    transition: all 0.2s;
  }
  .locate-btn:active { transform: scale(0.93); }
  .locate-btn.locating { border-color: var(--col-zute); color: var(--col-zute); animation: spin 1s linear infinite; }
  .locate-btn.located  { border-color: var(--col-zute); color: var(--col-zute); }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <div class="app-title">🗺 Parcelas <span>Órgiva</span> 2026</div>
    <div class="layer-toggle">
      <button class="layer-btn active" id="btn-street" onclick="setLayer('street')">🗺 Mapa</button>
      <button class="layer-btn" id="btn-sat" onclick="setLayer('sat')">🛰 Satélite</button>
    </div>
  </div>
  <div class="tabs">
    <button class="tab" id="tab-all" onclick="setRamal(null)">Todos</button>
    <button class="tab" id="tab-pago" onclick="setRamal('Pago')">🌿 Pago</button>
    <button class="tab" id="tab-zute" onclick="setRamal('Zute')">🏔 Zute</button>
    <button class="tab" id="tab-beber" onclick="setRamal('Beber')">💧 Beber</button>
  </div>
  <div class="search-wrapper" id="search-wrapper">
    <input type="text" class="search-input" id="search-input"
      placeholder="Buscar nombre o parcela..."
      oninput="onSearch(this.value)"
      autocomplete="off" autocorrect="off" autocapitalize="off"/>
    <div class="search-dropdown" id="search-dropdown"></div>
  </div>
</div>

<div id="map"></div>

<div class="info-panel" id="info-panel">
  <div class="panel-handle"></div>
  <button class="panel-close" onclick="closePanel()">✕</button>
  <div id="panel-content"></div>
</div>

// ── STATE ───────────────────────────────────────────────────────────
let currentRamal = null;
let polyLayers = [];
let activeLayer = null;

// ── UTILS ───────────────────────────────────────────────────────────
function parseISO(s) { return new Date(s); }
function formatDate(iso) {
  return new Date(iso).toLocaleDateString('es-ES', {weekday:'short',day:'numeric',month:'short'});
}
function formatTime(iso) { return iso.slice(11,16); }
function isNow(slot) {
  const n = new Date();
  return n >= parseISO(slot.inicio) && n < parseISO(slot.fin);
}
function isWatering(r) { return r.slots && r.slots.some(s => isNow(s)); }
function nextSlots(r, n) {
  if (!r.slots || !r.slots.length) return [];
  const now = new Date();
  return [...r.slots]
    .sort((a,b) => parseISO(a.inicio)-parseISO(b.inicio))
    .filter(s => parseISO(s.fin) > now)
    .slice(0,n);
}

// ── COLORS ──────────────────────────────────────────────────────────
function getColor(r, active) {
  if (active) return '#f78166';
  if (isWatering(r)) return '#f78166';
  if (r.ramal === 'Pago') return '#3fb950';
  if (r.ramal === 'Zute') return '#58a6ff';
  return '#e3b341';
}

function getFillOpacity(r, active) {
  return active ? 0.65 : (isWatering(r) ? 0.5 : 0.22);
}

// ── RENDER MAP ──────────────────────────────────────────────────────
function renderMap() {
  polyLayers.forEach(l => map.removeLayer(l));
  polyLayers = [];
  activeLayer = null;

  const pool = currentRamal ? DATA.filter(r => r.ramal === currentRamal) : DATA;
  const withGeo = pool.filter(r => r.poly && r.poly.length > 2);

  withGeo.forEach(r => {
    const color = getColor(r, false);
    const layer = L.polygon(r.poly, {
      color: color,
      weight: 1.5,
      fillColor: color,
      fillOpacity: getFillOpacity(r, false),
    });
    layer._rd = r;
    layer.on('click', () => selectRegante(r, layer));
    layer.bindTooltip(r.nombre, { sticky: true });
    layer.addTo(map);
    polyLayers.push(layer);
  });
}

// ── SELECT ──────────────────────────────────────────────────────────
function selectRegante(r, layer) {
  if (activeLayer) {
    const pr = activeLayer._rd;
    activeLayer.setStyle({
      color: getColor(pr,false), fillColor: getColor(pr,false),
      fillOpacity: getFillOpacity(pr,false), weight: 1.5
    });
  }
  activeLayer = layer;
  layer.setStyle({ color:'#f78166', fillColor:'#f78166', fillOpacity:0.6, weight:3 });
  map.fitBounds(layer.getBounds(), {padding:[60,60]});
  showPanel(r);
}

function showPanel(r) {
  const now = new Date();
  const watering = isWatering(r);
  const next = nextSlots(r, 5);
  const hasSchedule = r.slots && r.slots.length > 0;
  const ramBadge = r.ramal === 'Pago' ? 'bp' : r.ramal === 'Zute' ? 'bz' : 'bb';
  const acequiaShort = (r.acequia||'').replace(/^(Pago|Zute|Beber)\s*/i,'');

  let slotsHtml = '';
  if (!hasSchedule) {
    slotsHtml = '<div class="no-schedule">Sin carta de riego — solo cartografía</div>';
  } else if (next.length === 0) {
    slotsHtml = '<div class="no-schedule">Sin más riegos pendientes en 2026</div>';
  } else {
    slotsHtml = `
      <div class="slots-title">Próximos riegos</div>
      ${next.map(s => `
        <div class="slot-row">
          <span class="slot-date">${formatDate(s.inicio)}</span>
          <span class="slot-time">${formatTime(s.inicio)} → ${formatTime(s.fin)}</span>
          ${isNow(s) ? '<span class="slot-now">AHORA</span>' : ''}
        </div>
      `).join('')}
    `;
  }

  document.getElementById('panel-content').innerHTML = `
    <div class="panel-name">${r.nombre}</div>
    ${watering ? '<div class="now-badge"><span class="now-dot"></span>Regando ahora</div>' : ''}
    <div class="info-grid">
      <div class="info-field">
        <div class="info-label">Parcela ID</div>
        <div class="info-value">${r.parcela}</div>
      </div>
      <div class="info-field">
        <div class="info-label">Ramal</div>
        <div class="info-value"><span class="badge ${ramBadge}">${r.ramal}</span></div>
      </div>
      <div class="info-field">
        <div class="info-label">Acequia</div>
        <div class="info-value" style="font-size:10px;font-family:'Sora',sans-serif">${acequiaShort||r.acequia||'—'}</div>
      </div>
      <div class="info-field">
        <div class="info-label">${hasSchedule ? 'T. Riego' : 'Celemines'}</div>
        <div class="info-value">${hasSchedule ? (r.t_riego||'—')+'h' : (r.celemines||'—')}</div>
      </div>
    </div>
    ${slotsHtml}
  `;
  document.getElementById('info-panel').classList.add('open');
}

function closePanel() {
  document.getElementById('info-panel').classList.remove('open');
  if (activeLayer) {
    const pr = activeLayer._rd;
    activeLayer.setStyle({
      color: getColor(pr,false), fillColor: getColor(pr,false),
      fillOpacity: getFillOpacity(pr,false), weight: 1.5
    });
    activeLayer = null;
  }
}

// ── RAMAL FILTER ────────────────────────────────────────────────────
function setRamal(ramal) {
  currentRamal = ramal;
  document.getElementById('tab-all').className   = 'tab' + (!ramal      ? ' at' : '');
  document.getElementById('tab-pago').className  = 'tab' + (ramal==='Pago'  ? ' ap' : '');
  document.getElementById('tab-zute').className  = 'tab' + (ramal==='Zute'  ? ' az' : '');
  document.getElementById('tab-beber').className = 'tab' + (ramal==='Beber' ? ' ab' : '');
  closePanel();
  renderMap();
}

// ── SEARCH ──────────────────────────────────────────────────────────
function onSearch(val) {
  const dd = document.getElementById('search-dropdown');
  const q = val.trim().toLowerCase();
  if (!q) { dd.className = 'search-dropdown'; return; }

  let pool = currentRamal ? DATA.filter(r => r.ramal === currentRamal) : DATA;
  const results = pool
    .filter(r => r.poly && r.poly.length > 2)
    .filter(r => r.nombre.toLowerCase().includes(q) || r.parcela.toLowerCase().includes(q))
    .slice(0, 14);

  if (!results.length) {
    dd.innerHTML = '<div style="padding:12px;font-size:12px;color:var(--text3)">Sin resultados</div>';
  } else {
    dd.innerHTML = results.map(r => {
      const bc = r.ramal==='Pago'?'bp':r.ramal==='Zute'?'bz':'bb';
      const has = r.slots && r.slots.length > 0;
      return `<div class="search-item" onclick="searchSelect('${r.parcela}','${r.ramal}')">
        <div class="si-name">${r.nombre}</div>
        <div class="si-meta">
          <span>📍 ${r.parcela}</span>
          <span class="badge ${bc}">${r.ramal}</span>
          ${has ? '' : '<span style="color:var(--col-beber);font-size:10px">sin carta</span>'}
        </div>
      </div>`;
    }).join('');
  }
  dd.className = 'search-dropdown open';
}

function searchSelect(parcela, ramal) {
  document.getElementById('search-input').value = '';
  document.getElementById('search-dropdown').className = 'search-dropdown';

  const r = DATA.find(x => x.parcela === parcela && x.ramal === ramal);
  if (!r || !r.poly) return;

  // Switch ramal filter if needed so layer exists
  if (currentRamal && currentRamal !== ramal) {
    currentRamal = ramal;
    document.getElementById('tab-all').className   = 'tab';
    document.getElementById('tab-pago').className  = 'tab' + (ramal==='Pago'  ? ' ap' : '');
    document.getElementById('tab-zute').className  = 'tab' + (ramal==='Zute'  ? ' az' : '');
    document.getElementById('tab-beber').className = 'tab' + (ramal==='Beber' ? ' ab' : '');
    renderMap();
  }

  const layer = polyLayers.find(l => l._rd && l._rd.parcela === parcela && l._rd.ramal === ramal);
  if (layer) selectRegante(r, layer);
}

// Close dropdown when tapping map
map.on('click', () => {
  document.getElementById('search-dropdown').className = 'search-dropdown';
});


// ── MY LOCATION ─────────────────────────────────────────────────────
let locationMarker = null;
let locationCircle = null;

function locateMe() {
  const btn = document.getElementById('locate-btn');
  if (!navigator.geolocation) {
    alert('Tu navegador no soporta geolocalización');
    return;
  }

  btn.classList.add('locating');
  btn.textContent = '↻';

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lng = pos.coords.longitude;
      const acc = pos.coords.accuracy;

      // Remove previous
      if (locationMarker) map.removeLayer(locationMarker);
      if (locationCircle) map.removeLayer(locationCircle);

      // Accuracy circle
      locationCircle = L.circle([lat, lng], {
        radius: acc,
        color: '#58a6ff',
        fillColor: '#58a6ff',
        fillOpacity: 0.1,
        weight: 1.5
      }).addTo(map);

      // Blue dot marker
      const dotIcon = L.divIcon({
        className: '',
        html: `<div style="
          width:16px;height:16px;
          background:#58a6ff;
          border:3px solid white;
          border-radius:50%;
          box-shadow:0 2px 8px rgba(0,0,0,0.4);
        "></div>`,
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });

      locationMarker = L.marker([lat, lng], { icon: dotIcon })
        .addTo(map)
        .bindPopup('<div style="font-family:Sora,sans-serif;font-size:12px;color:#e6edf3">📍 Tu ubicación<br><span style="color:#8b949e;font-size:10px">±' + Math.round(acc) + 'm</span></div>');

      // Fly to location
      map.flyTo([lat, lng], Math.max(map.getZoom(), 16), { duration: 1.2 });

      btn.classList.remove('locating');
      btn.classList.add('located');
      btn.textContent = '📍';
    },
    (err) => {
      btn.classList.remove('locating');
      btn.textContent = '📍';
      const msgs = {
        1: 'Permiso de ubicación denegado. Actívalo en los ajustes del navegador.',
        2: 'No se pudo obtener la ubicación.',
        3: 'Tiempo de espera agotado.'
      };
      alert(msgs[err.code] || 'Error de geolocalización');
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 30000 }
  );
}

// ── INIT ────────────────────────────────────────────────────────────
setRamal(null);
</script>

<button class="locate-btn" id="locate-btn" onclick="locateMe()" title="Mi ubicación">📍</button>

</body>
</html>
